[package]
name = "merge-machines"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Conflict-free replicated data types and the clocks they need - counters, registers, sets, Lamport and hybrid logical clocks, no_std with zero dependencies"
repository = "https://github.com/seuros/merge_machines"
keywords = ["crdt", "lamport", "replication", "eventual-consistency", "no-std"]
categories = ["no-std", "data-structures"]
readme = "README.md"
exclude = ["src/**/tests.rs"]

[lib]
name = "merge_machines"
crate-type = ["lib"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[lints]
workspace = true
